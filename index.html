<!-- ANG HR v5 入口頁補丁：公司建立時要求 Google Drive 資料夾 ID + 測試上傳
     貼法：放在 index.html 最後面，</body> 前。 -->
<style>
  .ang-drive-folder-block{
    margin-top:10px;
    padding:12px;
    border-radius:18px;
    border:1px solid var(--line,rgba(148,163,184,.24));
    background:rgba(255,255,255,.52);
  }
  body[data-theme="dark"] .ang-drive-folder-block{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
  .ang-drive-folder-grid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
  .ang-drive-folder-grid .inline-label{font-size:13px;font-weight:1000;color:var(--main-text,#0f172a);margin-bottom:6px}
  .ang-drive-folder-grid .inline-input{margin:0!important;letter-spacing:0!important;text-transform:none!important;font-size:14px!important;min-height:48px!important}
  .ang-drive-test-btn{height:48px;min-width:82px;border-radius:16px;background:var(--secondary-bg,#f8fafc);color:var(--secondary-text,#1e1b4b);border:1px solid var(--secondary-border,#c7d2fe);font-weight:1000;font-size:14px;white-space:nowrap}
  body[data-theme="dark"] .ang-drive-test-btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
  .ang-drive-note{margin-top:8px;color:var(--muted-text,#64748b);font-size:12px;line-height:1.45;font-weight:850}
</style>
<script>
(function(){
  const PLANS = ['basic','plus','premium'];

  function qs(id){ return document.getElementById(id); }
  function safeText(v){ return String(v == null ? '' : v).trim(); }
  function statusId(plan){ return plan + 'PlanStatus'; }
  function driveInputId(plan){ return plan + 'DriveFolderId'; }
  function driveStatusId(plan){ return plan + 'DriveFolderStatus'; }

  function normalizeAuthMessage(msg){
    const s = safeText(msg);
    if (/帳號不存在|找不到帳號|查無帳號|無此帳號|公司.*錯|company|companyCode|公司代碼|驗證失敗|token/i.test(s)) {
      return '公司代碼或身份驗證錯誤：請確認公司代碼、帳號 / 工號與驗證 token。';
    }
    return s;
  }

  const oldSetStatus = window.setStatus;
  window.setStatus = function(id,type,message){
    if (typeof oldSetStatus === 'function') return oldSetStatus(id,type,normalizeAuthMessage(message));
    const box = qs(id);
    if (!box) return;
    box.className = 'status';
    if (!message) { box.innerText = ''; box.classList.remove('show'); return; }
    box.classList.add('show',type || 'info');
    box.innerText = normalizeAuthMessage(message);
  };

  function extractDriveFolderId(value){
    const raw = safeText(value);
    if (!raw) return '';
    const m1 = raw.match(/folders\/([a-zA-Z0-9_-]+)/);
    if (m1) return m1[1];
    const m2 = raw.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m2) return m2[1];
    return raw.replace(/^https?:\/\/drive\.google\.com\/.*$/,'').trim() || raw;
  }

  function getDriveFolderId(plan){
    const input = qs(driveInputId(plan));
    const id = extractDriveFolderId(input ? input.value : '');
    if (input && id && input.value !== id) input.value = id;
    return id;
  }

  function getDeviceId(){
    try { return (window.APP_STATE && APP_STATE.deviceId) || localStorage.getItem('ang_device_id') || ''; }
    catch(err){ return ''; }
  }

  function getGasUrl(){
    try { if (typeof getGasApiUrl === 'function') return getGasApiUrl(); } catch(err){}
    try { if (window.ANG_DATA_URLS && ANG_DATA_URLS.gasApiUrl) return ANG_DATA_URLS.gasApiUrl; } catch(err){}
    try { return localStorage.getItem('ang_gas_api_url') || ''; } catch(err){}
    return '';
  }

  function postToGas(action,payload){
    const url = getGasUrl();
    if (!url) return Promise.reject(new Error('缺少 GAS API URL'));
    return fetch(url,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({},payload || {},{ action:action }))
    }).then(r=>r.text()).then(t=>{
      try { return t ? JSON.parse(t) : {}; }
      catch(err){ return { ok:false, message:'GAS 回傳不是 JSON：' + t.slice(0,120) }; }
    });
  }

  function ensureDriveUI(){
    PLANS.forEach(function(plan){
      const email = qs(plan + 'SignupEmail');
      if (!email) return;
      const form = email.closest('.inline-form') || email.parentElement;
      if (!form || qs(driveInputId(plan))) return;

      const block = document.createElement('div');
      block.className = 'ang-drive-folder-block';
      block.innerHTML =
        '<div class="ang-drive-folder-grid">' +
          '<div>' +
            '<div class="inline-label">Google Drive 公開資料夾 ID</div>' +
            '<input class="inline-input" id="'+driveInputId(plan)+'" type="text" autocomplete="off" placeholder="貼上資料夾 ID 或 Drive 資料夾網址" />' +
          '</div>' +
          '<button class="ang-drive-test-btn" type="button" data-drive-test="'+plan+'">測試</button>' +
        '</div>' +
        '<div class="ang-drive-note">建立公司前必填。請先把資料夾共用權限設為公開 / 知道連結者可存取；測試會上傳 ANG_FOLDER_TEST.txt，完成後請自行到 Drive 檢查。</div>' +
        '<div id="'+driveStatusId(plan)+'" class="status"></div>';
      form.appendChild(block);
    });
  }

  window.testCompanyDriveFolder = function(plan){
    const safePlan = safeText(plan).toLowerCase();
    const folderId = getDriveFolderId(safePlan);
    const st = driveStatusId(safePlan);
    if (!folderId) { setStatus(st,'error','請先輸入 Google Drive 資料夾 ID'); return; }
    setStatus(st,'info','正在測試資料夾，會上傳 ANG_FOLDER_TEST.txt...');

    const payload = { plan:safePlan, folderId:folderId, googleDriveFolderId:folderId, deviceId:getDeviceId() };

    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res){
          if (!res || !res.ok) { setStatus(st,'error',(res && (res.message || res.msg)) || '測試失敗'); return; }
          const input = qs(driveInputId(safePlan));
          if (input) input.dataset.tested = '1';
          setStatus(st,'success',(res.message || '測試檔已上傳，請自行到 Drive 資料夾檢查。'));
        })
        .withFailureHandler(function(err){ setStatus(st,'error',err && err.message ? err.message : '測試連線失敗'); })
        .testCompanyDriveFolderAccess(payload);
      return;
    }

    postToGas('testCompanyDriveFolderAccess',payload).then(function(res){
      if (!res || !res.ok) { setStatus(st,'error',(res && (res.message || res.msg)) || '測試失敗'); return; }
      const input = qs(driveInputId(safePlan));
      if (input) input.dataset.tested = '1';
      setStatus(st,'success',(res.message || '測試檔已上傳，請自行到 Drive 資料夾檢查。'));
    }).catch(function(err){ setStatus(st,'error',err && err.message ? err.message : '測試連線失敗'); });
  };

  document.addEventListener('click',function(ev){
    const btn = ev.target && ev.target.closest ? ev.target.closest('[data-drive-test]') : null;
    if (!btn) return;
    ev.preventDefault();
    window.testCompanyDriveFolder(btn.getAttribute('data-drive-test'));
  },true);

  function requireDriveBeforeSignup(plan){
    const safePlan = safeText(plan).toLowerCase();
    const folderId = getDriveFolderId(safePlan);
    if (!folderId) { setStatus(statusId(safePlan),'error','建立公司前請輸入 Google Drive 公開資料夾 ID'); return ''; }
    const input = qs(driveInputId(safePlan));
    if (input && input.dataset.tested !== '1') { setStatus(statusId(safePlan),'error','請先按旁邊「測試」，確認測試檔可上傳後再建立公司'); return ''; }
    return folderId;
  }

  function isValidEmailLocal(email){
    if (typeof window.isValidEmail === 'function') return window.isValidEmail(email);
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
  }

  window.requestPlanEmailVerification = function(plan){
    const safePlan = safeText(plan).toLowerCase();
    const input = qs(safePlan + 'SignupEmail');
    const email = safeText(input ? input.value : '');
    const st = statusId(safePlan);
    const folderId = requireDriveBeforeSignup(safePlan);
    if (!folderId) return;
    if (!safePlan) return;
    if (!isValidEmailLocal(email)) { setStatus(st,'error','請輸入正確的 Email'); return; }
    setStatus(st,'info','正在送出註冊驗證...');

    const payload = { plan:safePlan, email:email, deviceId:getDeviceId(), driveFolderId:folderId, folderId:folderId, googleDriveFolderId:folderId };
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(res){
        if (!res || !res.ok) { setStatus(st,'error',(res && (res.message || res.msg)) || '驗證送出失敗'); return; }
        setStatus(st,'success',(res.message || res.msg) || '已送出驗證，請查看 Email');
        if (res.nextUrl) setTimeout(function(){ window.location.href = res.nextUrl; },650);
      }).withFailureHandler(function(err){ setStatus(st,'error',err && err.message ? err.message : '連線失敗'); })
        .requestCompanySignupEmailVerification(payload);
      return;
    }
    postToGas('requestCompanySignupEmailVerification',payload).then(function(res){
      if (!res || !res.ok) { setStatus(st,'error',(res && (res.message || res.msg)) || '驗證送出失敗'); return; }
      setStatus(st,'success',(res.message || res.msg) || '已送出驗證，請查看 Email');
      if (res.nextUrl || res.url) setTimeout(function(){ window.location.href = res.nextUrl || res.url; },650);
    }).catch(function(err){ setStatus(st,'error',err && err.message ? err.message : '連線失敗'); });
  };

  window.requestPlanGoogleVerification = function(plan){
    const safePlan = safeText(plan).toLowerCase();
    const st = statusId(safePlan);
    const folderId = requireDriveBeforeSignup(safePlan);
    if (!folderId) return;
    if (!safePlan) return;
    setStatus(st,'info','正在開啟 Google 驗證...');

    const payload = { plan:safePlan, deviceId:getDeviceId(), driveFolderId:folderId, folderId:folderId, googleDriveFolderId:folderId };
    function openAuth(url){
      if (typeof window.openGoogleAuthUrl === 'function') openGoogleAuthUrl(url,st);
      else window.location.href = url;
    }
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(res){
        if (!res || !res.ok) { setStatus(st,'error',(res && (res.message || res.msg)) || 'Google 驗證啟動失敗'); return; }
        if (res.authUrl || res.nextUrl) { openAuth(res.authUrl || res.nextUrl); return; }
        setStatus(st,'success','Google 驗證已啟動');
      }).withFailureHandler(function(err){ setStatus(st,'error',err && err.message ? err.message : '連線失敗'); })
        .requestCompanySignupGoogleVerification(payload);
      return;
    }
    postToGas('requestCompanySignupGoogleVerification',payload).then(function(res){
      if (!res || !res.ok) { setStatus(st,'error',(res && (res.message || res.msg)) || 'Google 驗證啟動失敗'); return; }
      if (res.authUrl || res.nextUrl || res.url) { openAuth(res.authUrl || res.nextUrl || res.url); return; }
      setStatus(st,'success','Google 驗證已啟動');
    }).catch(function(err){ setStatus(st,'error',err && err.message ? err.message : '連線失敗'); });
  };

  window.addEventListener('load',ensureDriveUI);
  document.addEventListener('DOMContentLoaded',ensureDriveUI);
})();
</script>
