<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ANG HR｜APK 免登入啟動</title>
  <style>
    :root{--a:#ff7a21;--b:#ffac73;--bg:#0f1117;--card:rgba(255,255,255,.09);--txt:#fff;--muted:rgba(255,255,255,.68)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 30% 15%,rgba(255,122,33,.34),transparent 32%),linear-gradient(180deg,#171923,#050608);color:var(--txt)}
    body{display:flex;align-items:center;justify-content:center;padding:22px}
    .card{width:min(420px,100%);border-radius:28px;padding:24px;background:var(--card);border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 60px rgba(0,0,0,.36);backdrop-filter:blur(18px);text-align:center}
    .logo{width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-weight:1000;font-size:22px;box-shadow:0 14px 32px rgba(255,122,33,.28)}
    h1{font-size:22px;margin:0 0 8px}.p{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 18px}
    button{width:100%;border:none;border-radius:18px;padding:14px 16px;font-weight:1000;font-size:15px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 14px 28px rgba(255,122,33,.24)}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ANG</div>
    <h1>APK 免登入模式</h1>
    <p>正在以平台 Creator 身分進入管理中心。<br>employee_id = ANG8963｜company_id = PLATFORM</p>
    <button onclick="goAdmin()">立即進入管理中心</button>
  </div>
  <script>
    function seed(){
      var token='APK_NO_LOGIN_CREATOR_ANG8963';
      try{
        localStorage.setItem('ang_hr_apk_no_login','1');
        localStorage.setItem('ang_hr_active_company_id','PLATFORM');
        localStorage.setItem('ang_company_id','PLATFORM');
        localStorage.setItem('company_id','PLATFORM');
        localStorage.setItem('ang_hr_active_employee_id','ANG8963');
        localStorage.setItem('ang_employee_id','ANG8963');
        localStorage.setItem('employee_id','ANG8963');
        localStorage.setItem('loginId','ANG8963');
        localStorage.setItem('ang_user_role','Creator');
        localStorage.setItem('ang_employee_role','Creator');
        localStorage.setItem('ang_hr_active_login_token',token);
        localStorage.setItem('session_token',token);
        localStorage.setItem('loginToken',token);
        localStorage.setItem('emp_login_token',token);
        localStorage.setItem('ang_employee_token',token);
        localStorage.setItem('ang_hr_device_id','APK-NOLOGIN-ANG8963');
        localStorage.setItem('ang_device_id','APK-NOLOGIN-ANG8963');
        localStorage.setItem('device_id','APK-NOLOGIN-ANG8963');
        localStorage.setItem('ang_app_mode','apk_no_login');
        localStorage.setItem('isLoggedIn','1');
      }catch(e){}
    }
    function goAdmin(){
      seed();
      location.replace('admin.html?company_id=PLATFORM&id=ANG8963&employee_id=ANG8963&role=Creator&token=APK_NO_LOGIN_CREATOR_ANG8963&session_token=APK_NO_LOGIN_CREATOR_ANG8963&device_id=APK-NOLOGIN-ANG8963&app=apk_no_login&_ts='+Date.now());
    }
    setTimeout(goAdmin,350);
  </script>
</body>
</html>
