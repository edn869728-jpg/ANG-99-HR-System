<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ANG HR</title>
  <script src="./config.js"></script>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--main:#ff7a21;--deep:#c45a10}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#fff7ed 0,#f6f7fb 45%,#eef2ff 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:22px}
    .card{width:100%;max-width:430px;background:rgba(255,255,255,.92);border:1px solid rgba(229,231,235,.9);border-radius:30px;box-shadow:0 24px 60px rgba(17,24,39,.12);padding:26px}
    .logo{width:70px;height:70px;border-radius:24px;background:linear-gradient(135deg,#ff8a2a,#ff6d1d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:24px;box-shadow:0 18px 36px rgba(255,122,33,.28);margin-bottom:18px}
    h1{font-size:30px;margin:0 0 8px}
    p{color:var(--muted);line-height:1.6;margin:0 0 20px}
    .btn{width:100%;border:0;border-radius:18px;padding:15px 14px;font-size:16px;font-weight:1000;margin-top:10px}
    .primary{background:linear-gradient(135deg,#ff8a2a,#ff6d1d);color:#fff;box-shadow:0 14px 30px rgba(255,122,33,.24)}
    .dark{background:#111827;color:#fff}
    .ghost{background:#fff;color:#374151;border:1px solid var(--line)}
    .hint{font-size:12px;color:#9ca3af;margin-top:18px;line-height:1.5}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">HR</div>
    <h1>ANG HR</h1>
    <p>請選擇登入方式。若是第一次使用，請輸入公司代號、帳號與密碼，或使用員工一次性開通連結。</p>
    <button class="btn primary" onclick="goLogin()">登入 / 開通</button>
    <button class="btn dark" onclick="goTrial()">全功能免費體驗區</button>
    <button class="btn ghost" onclick="goDiag()">診斷資料來源</button>
    <button class="btn ghost" onclick="goPlatform()">平台總管理</button>
    <div class="hint" id="hint"></div>
  </main>
<script>
(function(){
  const CFG = window.ANG_HR_CONFIG || {};
  const qs = new URLSearchParams(location.search);
  const deviceId = qs.get('device_id') || localStorage.getItem('ang_device_id') || '';
  const companyCode = qs.get('company_code') || qs.get('company_id') || localStorage.getItem('ang_company_code') || CFG.defaultCompanyCode || '';
  document.getElementById('hint').textContent = 'Company：' + (companyCode || '未指定') + (deviceId ? '｜Device：' + deviceId : '');
})();
function keepParams(page){
  const qs = new URLSearchParams(location.search);
  qs.set('_ts', Date.now());
  return './' + page + '?' + qs.toString();
}
function goLogin(){ location.href = keepParams('login.html'); }
function goTrial(){ location.href = keepParams('trial.html'); }
function goDiag(){ location.href = keepParams('diagnostics.html'); }
function goPlatform(){ location.href = keepParams('platform_admin.html'); }
</script>
</body>
</html>
