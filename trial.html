<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ANG HR 免費體驗</title>
  <script src="./config.js"></script>
  <style>
    body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f6f7fb;color:#111827;display:flex;align-items:center;justify-content:center;padding:22px}
    .card{max-width:430px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:28px;box-shadow:0 20px 50px rgba(17,24,39,.10);padding:24px}
    h1{margin:0 0 8px;font-size:26px}.p{color:#6b7280;line-height:1.6}
    label{display:block;font-size:13px;font-weight:900;margin:14px 0 7px}
    input{width:100%;height:48px;border:1px solid #d1d5db;border-radius:16px;padding:0 14px;font-size:15px}
    button{width:100%;height:50px;border:0;border-radius:18px;background:linear-gradient(135deg,#ff8a2a,#ff6d1d);color:white;font-weight:1000;margin-top:16px;font-size:16px}
    .status{margin-top:14px;border:1px solid #e5e7eb;border-radius:16px;background:#f9fafb;padding:12px;white-space:pre-wrap;font-size:13px;line-height:1.5}
  </style>
</head>
<body>
  <main class="card">
    <h1>全功能免費體驗區</h1>
    <div class="p">建立一組 Premium 功能展示環境，之後可再轉正式版。</div>
    <label>公司 / 店名</label><input id="name" placeholder="例如 99泰式燒烤火鍋">
    <label>創辦人 Email</label><input id="email" type="email" placeholder="you@example.com">
    <label>創辦人姓名</label><input id="owner" placeholder="姓名">
    <button id="btn">建立免費體驗</button>
    <div id="status" class="status">準備中...</div>
  </main>
<script>
const CFG=window.ANG_HR_CONFIG||{},GAS=CFG.apiBaseUrl||CFG.gasApiUrl||'',FRONT=(CFG.frontendBaseUrl||location.origin).replace(/\/+$/,'');
function device(){let v=new URLSearchParams(location.search).get('device_id')||localStorage.getItem('ang_device_id')||'';if(!v){v='web-'+Date.now();localStorage.setItem('ang_device_id',v)}return v}
async function api(action,payload){const res=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,device_id:device(),app:1},payload||{}))});return JSON.parse(await res.text())}
function st(s){document.getElementById('status').textContent=s}
document.getElementById('btn').onclick=async()=>{try{st('建立中...');const data=await api('startFreeTrial',{company_name:document.getElementById('name').value,owner_email:document.getElementById('email').value,owner_name:document.getElementById('owner').value});if(!data.ok)throw new Error(data.message||'建立失敗');st('建立完成\\n公司代號：'+data.company_code+'\\n帳號：'+data.id+'\\n密碼：'+(data.password||'請查看回傳'));}catch(e){st(e.message)}};
</script>
</body>
</html>
