<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ANG HR 平台總管理</title>
  <script src="./config.js"></script>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--main:#ff7a21;--deep:#c45a10;--ok:#059669;--err:#dc2626;--shadow:0 18px 48px rgba(17,24,39,.10)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
    body{padding:18px;background:radial-gradient(circle at top,#fff7ed 0,#f6f7fb 46%,#eef2ff 100%)}
    .wrap{max-width:1100px;margin:0 auto 80px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#ff8a2a,#ff6d1d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:1000;box-shadow:0 14px 28px rgba(255,122,33,.25)}
    h1{font-size:24px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}
    .grid{display:grid;grid-template-columns:340px 1fr;gap:14px}
    .card{background:rgba(255,255,255,.96);border:1px solid rgba(229,231,235,.95);border-radius:24px;box-shadow:var(--shadow);padding:16px}
    .sectionTitle{font-size:15px;font-weight:1000;margin:0 0 12px}
    label{display:block;font-size:12px;font-weight:1000;color:#374151;margin:10px 0 6px}
    input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:14px;padding:11px 12px;font-size:14px;background:#fff;outline:none}
    textarea{min-height:86px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:var(--main);box-shadow:0 0 0 4px rgba(255,122,33,.12)}
    .btn{border:0;border-radius:15px;padding:12px 14px;font-size:14px;font-weight:1000;cursor:pointer}
    .primary{background:linear-gradient(135deg,#ff8a2a,#ff6d1d);color:#fff;box-shadow:0 10px 24px rgba(255,122,33,.22)}
    .dark{background:#111827;color:#fff}
    .ghost{background:#fff;border:1px solid var(--line);color:#374151}
    .blue{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe}
    .danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .list{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow:auto;padding-right:2px}
    .companyItem{border:1px solid var(--line);background:#fff;border-radius:18px;padding:12px;cursor:pointer}
    .companyItem.active{border-color:#fb923c;background:#fff7ed}
    .companyName{font-weight:1000;font-size:14px}.companyMeta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
    .pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:1000;margin-right:5px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:1000;font-size:13px;color:#374151}
    .tab.active{background:#111827;color:#fff;border-color:#111827}
    .hidden{display:none!important}
    .status{margin-top:12px;border:1px solid var(--line);border-radius:16px;background:#f9fafb;padding:12px;white-space:pre-wrap;font-size:13px;line-height:1.55;color:#374151}
    .status.ok{border-color:#a7f3d0;background:#ecfdf5;color:#065f46}.status.err{border-color:#fecaca;background:#fef2f2;color:#991b1b}
    .tableWrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff}
    table{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
    th,td{border-bottom:1px solid #f3f4f6;padding:10px;text-align:left;white-space:nowrap}
    th{background:#f9fafb;color:#374151;font-weight:1000}
    .small{font-size:12px;color:var(--muted);line-height:1.55}
    @media(max-width:860px){body{padding:12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="logo">8963</div>
        <div>
          <h1>平台總管理</h1>
          <div class="sub">可切換並修改所有公司資料｜不占用各公司 0603</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn ghost" onclick="goLogin()">回登入</button>
        <button class="btn dark" onclick="goAdmin()">目前公司後台</button>
      </div>
    </header>

    <div class="grid">
      <aside class="card">
        <h2 class="sectionTitle">公司清單</h2>
        <div class="row">
          <input id="search" placeholder="搜尋公司代號 / 名稱">
          <button class="btn primary" onclick="loadCompanies()">重新整理</button>
        </div>
        <div class="actions">
          <button class="btn blue" onclick="newCompany()">新增公司</button>
          <button class="btn ghost" onclick="ensureSheets()">補齊工作表</button>
        </div>
        <div id="companyList" class="list" style="margin-top:12px"></div>
      </aside>

      <main class="card">
        <div class="tabs">
          <button id="tabCompany" class="tab active" onclick="setTab('company')">公司設定</button>
          <button id="tabBranches" class="tab" onclick="setTab('branches')">分店 / 部門</button>
          <button id="tabPeople" class="tab" onclick="setTab('people')">人員管理</button>
          <button id="tabTools" class="tab" onclick="setTab('tools')">跨公司工具</button>
        </div>

        <section id="panelCompany">
          <h2 class="sectionTitle">公司基本資料</h2>
          <div class="row">
            <div><label>公司ID</label><input id="company_id" placeholder="ang_99"></div>
            <div><label>公司代號</label><input id="company_code" placeholder="ang_99"></div>
          </div>
          <div class="row">
            <div><label>公司名稱</label><input id="company_name" placeholder="99泰式"></div>
            <div><label>公司副名稱</label><input id="company_subtitle" placeholder="燒烤火鍋 吃到飽"></div>
          </div>
          <label>Logo URL</label><input id="logo_url" placeholder="https://...">
          <div class="row">
            <div><label>Fallback Text</label><input id="fallback_text" placeholder="ANG"></div>
            <div><label>主題色</label><input id="theme_color" placeholder="#ff7a21"></div>
          </div>
          <div class="row">
            <div><label>方案</label><select id="plan"><option>free</option><option>basic</option><option>plus</option><option selected>premium</option><option>trial</option></select></div>
            <div><label>狀態</label><select id="statusField"><option value="active">active</option><option value="paused">paused</option><option value="disabled">disabled</option></select></div>
          </div>
          <div class="row">
            <div><label>啟用分店</label><select id="enable_branch"><option value="是">是</option><option value="否">否</option></select></div>
            <div><label>啟用部門</label><select id="enable_department"><option value="是">是</option><option value="否">否</option></select></div>
          </div>
          <div class="row">
            <div><label>預設分店ID</label><input id="default_branch_id" placeholder="main"></div>
            <div><label>預設部門ID</label><input id="default_department_id" placeholder=""></div>
          </div>
          <label>創辦人 Email</label><input id="owner_email" placeholder="owner@example.com">
          <label>Google Client ID</label><input id="google_client_id" placeholder="xxxx.apps.googleusercontent.com">
          <div class="actions">
            <button class="btn primary" onclick="saveCompany()">儲存公司設定</button>
            <button class="btn dark" onclick="switchToCompany()">切換管理此公司</button>
            <button class="btn danger" onclick="disableCompany()">停用公司</button>
          </div>
        </section>

        <section id="panelBranches" class="hidden">
          <h2 class="sectionTitle">分店 / 部門設定</h2>
          <div class="row">
            <div class="card" style="box-shadow:none">
              <h3 class="sectionTitle">新增 / 更新分店</h3>
              <label>分店ID</label><input id="branch_id" placeholder="main">
              <label>分店名稱</label><input id="branch_name" placeholder="總店">
              <label>地址</label><input id="branch_address" placeholder="地址">
              <div class="row">
                <div><label>緯度</label><input id="branch_lat" placeholder="23.9"></div>
                <div><label>經度</label><input id="branch_lng" placeholder="120.9"></div>
              </div>
              <label>打卡半徑</label><input id="branch_radius" placeholder="150">
              <button class="btn primary" onclick="saveBranch()">儲存分店</button>
            </div>
            <div class="card" style="box-shadow:none">
              <h3 class="sectionTitle">新增 / 更新部門</h3>
              <label>部門ID</label><input id="dept_id" placeholder="ops">
              <label>部門名稱</label><input id="dept_name" placeholder="營運部">
              <label>分店ID</label><input id="dept_branch_id" placeholder="main">
              <button class="btn primary" onclick="saveDepartment()">儲存部門</button>
            </div>
          </div>
          <div class="actions"><button class="btn ghost" onclick="loadCompanyDetails()">重新載入分店 / 部門</button></div>
          <div id="branchDeptTables" style="margin-top:12px"></div>
        </section>

        <section id="panelPeople" class="hidden">
          <h2 class="sectionTitle">跨公司人員管理</h2>
          <div class="small">總管理 8963 可讀取 / 修改目前選定公司的員工資料。各公司自己的 0603 不影響平台總管理。</div>
          <div class="actions"><button class="btn primary" onclick="loadPeople()">載入此公司人員</button><button class="btn ghost" onclick="openAdminForCompany()">開啟公司後台</button></div>
          <div id="peopleTable" style="margin-top:12px"></div>
        </section>

        <section id="panelTools" class="hidden">
          <h2 class="sectionTitle">跨公司工具</h2>
          <div class="actions">
            <button class="btn primary" onclick="switchToCompany()">切換到選定公司</button>
            <button class="btn ghost" onclick="copyCompanyUrl()">複製公司後台網址</button>
            <button class="btn ghost" onclick="copyEmployeeUrl()">複製公司員工入口</button>
          </div>
          <div class="status" id="toolOutput">選定公司後可產生專屬入口。</div>
        </section>

        <div id="status" class="status">準備中...</div>
      </main>
    </div>
  </div>

<script>
(function(){
  const CFG = window.ANG_HR_CONFIG || {};
  const qs = new URLSearchParams(location.search);
  window.APP = {
    gas: qs.get('gas') || CFG.apiBaseUrl || CFG.gasApiUrl || '',
    front: String(CFG.frontendBaseUrl || location.origin + location.pathname.replace(/\/[^\/]*$/, '')).replace(/\/+$/,''),
    id: qs.get('id') || localStorage.getItem('ang_login_id') || '',
    token: qs.get('token') || localStorage.getItem('ang_login_token') || '',
    role: qs.get('role') || localStorage.getItem('ang_login_role') || '',
    deviceId: qs.get('device_id') || localStorage.getItem('ang_device_id') || '',
    companyCode: qs.get('company_code') || qs.get('company_id') || localStorage.getItem('ang_company_code') || CFG.defaultCompanyCode || 'ang_99',
    selectedCompany: null,
    companies: []
  };
  if (!APP.deviceId) {
    APP.deviceId = 'web-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    localStorage.setItem('ang_device_id', APP.deviceId);
  }
  if (!APP.id) setStatus('尚未登入。請先用 8963 / ANG8963 登入。', 'err');
  else loadCompanies();
})();

function $(id){return document.getElementById(id)}
function setStatus(msg,type){const el=$('status');el.textContent=msg||'';el.className='status'+(type?' '+type:'')}
function api(action,payload){
  if(!APP.gas) return Promise.reject(new Error('缺少 GAS URL'));
  return fetch(APP.gas,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({
    action,
    id:APP.id,
    token:APP.token,
    role:APP.role,
    device_id:APP.deviceId,
    company_code:APP.companyCode,
    company_id:APP.companyCode,
    target_company_code:APP.selectedCompany ? APP.selectedCompany.company_code : APP.companyCode,
    target_company_id:APP.selectedCompany ? APP.selectedCompany.company_id : APP.companyCode,
    app:1
  },payload||{}))}).then(r=>r.text()).then(t=>{try{return JSON.parse(t)}catch(e){throw new Error('GAS 回傳不是 JSON：'+t.slice(0,200))}})
}
function setTab(name){
  ['company','branches','people','tools'].forEach(k=>{
    $('panel'+cap(k)).classList.toggle('hidden',k!==name);
    $('tab'+cap(k)).classList.toggle('active',k===name);
  });
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function goLogin(){location.href='./login.html?_ts='+Date.now()}
function goAdmin(){openAdminForCompany()}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function ensureSheets(){
  setStatus('補齊工作表中...');
  const d=await api('ensureCompanySystemSheets',{});
  if(!d.ok) throw new Error(d.message||'失敗');
  setStatus(d.message||'完成','ok');
}
async function loadCompanies(){
  try{
    setStatus('載入公司清單...');
    const d=await api('platformListCompanies',{});
    if(!d.ok) throw new Error(d.message||'載入失敗');
    APP.companies=d.companies||[];
    renderCompanyList();
    setStatus('已載入 '+APP.companies.length+' 間公司','ok');
  }catch(e){setStatus(e.message,'err')}
}
function renderCompanyList(){
  const q=($('search').value||'').toLowerCase();
  const list=$('companyList');
  const rows=(APP.companies||[]).filter(c=>!q||String(c.company_code+' '+c.company_name+' '+c.company_id).toLowerCase().includes(q));
  list.innerHTML=rows.map((c,i)=>`
    <div class="companyItem ${APP.selectedCompany&&APP.selectedCompany.company_code===c.company_code?'active':''}" onclick="selectCompany('${encodeURIComponent(c.company_code)}')">
      <div class="companyName">${escapeHtml(c.company_name||c.company_code)}</div>
      <div class="companyMeta">
        <span class="pill">${escapeHtml(c.plan||'')}</span><span class="pill">${escapeHtml(c.status||'')}</span><br>
        ${escapeHtml(c.company_code||'')}｜${escapeHtml(c.company_id||'')}
      </div>
    </div>`).join('') || '<div class="small">沒有公司資料</div>';
}
$('search').addEventListener('input',renderCompanyList);

function selectCompany(codeEnc){
  const code=decodeURIComponent(codeEnc);
  APP.selectedCompany=(APP.companies||[]).find(c=>c.company_code===code)||null;
  fillCompanyForm(APP.selectedCompany||{});
  renderCompanyList();
  loadCompanyDetails().catch(e=>setStatus(e.message,'err'));
}
function fillCompanyForm(c){
  const map={
    company_id:'company_id',company_code:'company_code',company_name:'company_name',company_subtitle:'company_subtitle',
    logo_url:'logo_url',fallback_text:'fallback_text',theme_color:'theme_color',plan:'plan',
    status:'statusField',enable_branch:'enable_branch',enable_department:'enable_department',
    default_branch_id:'default_branch_id',default_department_id:'default_department_id',
    owner_email:'owner_email',google_client_id:'google_client_id'
  };
  Object.keys(map).forEach(k=>{const el=$(map[k]); if(el) el.value=c[k]||''});
}
function readCompanyForm(){
  return {
    company_id:$('company_id').value.trim(),
    company_code:$('company_code').value.trim(),
    company_name:$('company_name').value.trim(),
    company_subtitle:$('company_subtitle').value.trim(),
    logo_url:$('logo_url').value.trim(),
    fallback_text:$('fallback_text').value.trim(),
    theme_color:$('theme_color').value.trim(),
    plan:$('plan').value,
    status:$('statusField').value,
    enable_branch:$('enable_branch').value,
    enable_department:$('enable_department').value,
    default_branch_id:$('default_branch_id').value.trim(),
    default_department_id:$('default_department_id').value.trim(),
    owner_email:$('owner_email').value.trim(),
    google_client_id:$('google_client_id').value.trim()
  };
}
function newCompany(){
  APP.selectedCompany=null;
  fillCompanyForm({company_id:'',company_code:'',company_name:'',company_subtitle:'',fallback_text:'ANG',theme_color:'#ff7a21',plan:'premium',status:'active',enable_branch:'是',enable_department:'是',default_branch_id:'main'});
  setTab('company');
  setStatus('請輸入新公司資料後儲存。');
}
async function saveCompany(){
  try{
    const data=readCompanyForm();
    if(!data.company_code||!data.company_name) return setStatus('公司代號與公司名稱必填','err');
    setStatus('儲存公司設定...');
    const d=await api('platformSaveCompany',{company:data,target_company_code:data.company_code,target_company_id:data.company_id||data.company_code});
    if(!d.ok) throw new Error(d.message||'儲存失敗');
    setStatus(d.message||'儲存成功','ok');
    await loadCompanies();
    APP.selectedCompany=(APP.companies||[]).find(c=>c.company_code===data.company_code)||data;
    renderCompanyList();
  }catch(e){setStatus(e.message,'err')}
}
async function disableCompany(){
  if(!APP.selectedCompany) return setStatus('請先選公司','err');
  if(!confirm('確定停用 '+APP.selectedCompany.company_name+'？')) return;
  $('statusField').value='disabled';
  await saveCompany();
}
async function loadCompanyDetails(){
  if(!APP.selectedCompany) return;
  const d=await api('platformGetCompanyDetails',{target_company_code:APP.selectedCompany.company_code});
  if(!d.ok) throw new Error(d.message||'讀取失敗');
  renderBranchDept(d.branches||[],d.departments||[]);
}
function renderBranchDept(branches,depts){
  $('branchDeptTables').innerHTML = `
    <h3 class="sectionTitle">分店</h3>
    <div class="tableWrap"><table><thead><tr><th>ID</th><th>名稱</th><th>地址</th><th>定位</th></tr></thead><tbody>
      ${branches.map(b=>`<tr><td>${escapeHtml(b.branch_id)}</td><td>${escapeHtml(b.branch_name)}</td><td>${escapeHtml(b.address)}</td><td>${escapeHtml(b.lat)}, ${escapeHtml(b.lng)} / ${escapeHtml(b.radius)}</td></tr>`).join('')||'<tr><td colspan="4">無資料</td></tr>'}
    </tbody></table></div>
    <h3 class="sectionTitle" style="margin-top:14px">部門</h3>
    <div class="tableWrap"><table><thead><tr><th>ID</th><th>名稱</th><th>分店ID</th><th>啟用</th></tr></thead><tbody>
      ${depts.map(d=>`<tr><td>${escapeHtml(d.department_id)}</td><td>${escapeHtml(d.department_name)}</td><td>${escapeHtml(d.branch_id)}</td><td>${escapeHtml(d.enabled)}</td></tr>`).join('')||'<tr><td colspan="4">無資料</td></tr>'}
    </tbody></table></div>`;
}
async function saveBranch(){
  if(!APP.selectedCompany) return setStatus('請先選公司','err');
  const payload={branch:{branch_id:$('branch_id').value.trim(),branch_name:$('branch_name').value.trim(),address:$('branch_address').value.trim(),lat:$('branch_lat').value.trim(),lng:$('branch_lng').value.trim(),radius:$('branch_radius').value.trim(),enabled:'是'}};
  if(!payload.branch.branch_id||!payload.branch.branch_name) return setStatus('分店ID與名稱必填','err');
  const d=await api('platformSaveBranch',payload);
  if(!d.ok) throw new Error(d.message||'儲存分店失敗');
  setStatus(d.message||'分店已儲存','ok');
  await loadCompanyDetails();
}
async function saveDepartment(){
  if(!APP.selectedCompany) return setStatus('請先選公司','err');
  const payload={department:{department_id:$('dept_id').value.trim(),department_name:$('dept_name').value.trim(),branch_id:$('dept_branch_id').value.trim(),enabled:'是'}};
  if(!payload.department.department_id||!payload.department.department_name) return setStatus('部門ID與名稱必填','err');
  const d=await api('platformSaveDepartment',payload);
  if(!d.ok) throw new Error(d.message||'儲存部門失敗');
  setStatus(d.message||'部門已儲存','ok');
  await loadCompanyDetails();
}
async function loadPeople(){
  if(!APP.selectedCompany) return setStatus('請先選公司','err');
  setStatus('載入人員...');
  const d=await api('platformListPeople',{target_company_code:APP.selectedCompany.company_code});
  if(!d.ok) throw new Error(d.message||'載入人員失敗');
  const rows=d.people||[];
  $('peopleTable').innerHTML=`<div class="tableWrap"><table><thead><tr><th>員編</th><th>姓名</th><th>職級</th><th>Email</th><th>分店</th><th>部門</th><th>啟用</th></tr></thead><tbody>
    ${rows.map(p=>`<tr><td>${escapeHtml(p.id)}</td><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.role)}</td><td>${escapeHtml(p.email)}</td><td>${escapeHtml(p.branch_id)}</td><td>${escapeHtml(p.department_id)}</td><td>${escapeHtml(p.enabled)}</td></tr>`).join('')||'<tr><td colspan="7">無資料</td></tr>'}
  </tbody></table></div>`;
  setStatus('已載入 '+rows.length+' 筆人員','ok');
}
function companyUrl(page){
  const c=APP.selectedCompany||{};
  const qs=new URLSearchParams({id:APP.id,token:APP.token,role:APP.role||'Creator',company_id:c.company_code||APP.companyCode,company_code:c.company_code||APP.companyCode,target_company_id:c.company_id||c.company_code||APP.companyCode,target_company_code:c.company_code||APP.companyCode,device_id:APP.deviceId,platform_admin:'1',_ts:Date.now()});
  return APP.front+'/'+page+'?'+qs.toString();
}
function switchToCompany(){ if(!APP.selectedCompany)return setStatus('請先選公司','err'); location.href=companyUrl('admin.html') }
function openAdminForCompany(){ location.href=companyUrl('admin.html') }
async function copyCompanyUrl(){ const u=companyUrl('admin.html'); await navigator.clipboard.writeText(u); $('toolOutput').textContent='已複製公司後台：\n'+u }
async function copyEmployeeUrl(){ const u=companyUrl('employee.html'); await navigator.clipboard.writeText(u); $('toolOutput').textContent='已複製員工入口：\n'+u }
</script>
