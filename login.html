<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ANG HR 登入</title>
  <script src="./config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--main:#ff7a21;--deep:#c45a10;--ok:#059669;--err:#dc2626;--shadow:0 20px 50px rgba(17,24,39,.12)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text)}
    body{display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#fff7ed,#f6f7fb 48%,#eef2ff)}
    .wrap{width:100%;max-width:450px}
    .brand{display:flex;align-items:center;gap:14px;margin:0 0 16px 4px}
    .logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#ff8a2a,#ff6d1d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:18px;box-shadow:0 15px 30px rgba(255,122,33,.25)}
    h1{margin:0;font-size:26px;line-height:1.1}.sub{margin:5px 0 0;color:var(--muted);font-size:13px}
    .card{background:rgba(255,255,255,.95);border:1px solid rgba(229,231,235,.95);box-shadow:var(--shadow);border-radius:28px;padding:22px}
    .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;background:#f3f4f6;padding:5px;border-radius:18px;margin-bottom:16px}
    .tab{border:0;background:transparent;border-radius:14px;padding:10px 6px;font-size:13px;font-weight:1000;color:#6b7280}
    .tab.active{background:#fff;color:#111827;box-shadow:0 9px 20px rgba(17,24,39,.08)}
    label{display:block;font-size:13px;font-weight:1000;margin:12px 0 7px}
    input{width:100%;height:48px;border:1px solid #d1d5db;border-radius:16px;padding:0 14px;font-size:15px;background:#fff;outline:none}
    input:focus{border-color:var(--main);box-shadow:0 0 0 4px rgba(255,122,33,.12)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .btn{width:100%;height:50px;border:0;border-radius:18px;font-size:15px;font-weight:1000;margin-top:14px}
    .primary{background:linear-gradient(135deg,#ff8a2a,#ff6d1d);color:#fff;box-shadow:0 14px 30px rgba(255,122,33,.24)}
    .dark{background:#111827;color:#fff}
    .ghost{background:#fff;border:1px solid var(--line);color:#374151}
    .blue{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe}
    .hidden{display:none!important}
    .status{margin-top:14px;border-radius:16px;padding:12px;border:1px solid var(--line);background:#f9fafb;color:#374151;font-size:13px;line-height:1.55;white-space:pre-wrap}
    .status.ok{border-color:#a7f3d0;background:#ecfdf5;color:#065f46}.status.err{border-color:#fecaca;background:#fef2f2;color:#991b1b}
    .hint{font-size:12px;color:#6b7280;line-height:1.6;margin-top:10px}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .linkbtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;font-size:12px;font-weight:900;color:#374151}
    .googleBox{margin-top:12px;display:flex;justify-content:center;min-height:42px}
    .badge{display:inline-flex;align-items:center;border-radius:999px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;font-weight:900;padding:7px 10px;margin-top:8px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="logo">HR</div>
      <div><h1 id="brandTitle">ANG HR</h1><div class="sub" id="brandSub">登入 / 員工開通 / 免費體驗</div></div>
    </div>

    <section class="card">
      <div class="tabs">
        <button id="tabLogin" class="tab active" type="button">登入</button>
        <button id="tabBind" class="tab" type="button">一次性開通</button>
        <button id="tabTrial" class="tab" type="button">免費體驗</button>
      </div>

      <div id="loginPanel">
        <label for="companyCode">公司代號</label>
        <input id="companyCode" autocomplete="organization" placeholder="例如 ang_99" />

        <div class="row">
          <div>
            <label for="loginId">帳號 / 員編 / Email</label>
            <input id="loginId" autocomplete="username" placeholder="8963 / ANG8963 / 員編 / email" />
          </div>
          <div>
            <label for="loginPw">密碼</label>
            <input id="loginPw" autocomplete="current-password" type="password" placeholder="密碼" />
          </div>
        </div>

        <button id="loginBtn" class="btn primary" type="button">登入並綁定此裝置</button>
        <button id="autoBtn" class="btn dark" type="button">使用本機資料自動登入</button>

        <div class="googleBox">
          <div id="g_id_onload"></div>
          <div id="googleBtn"></div>
        </div>

        <div class="links">
          <button id="forgotCompanyBtn" class="linkbtn" type="button">忘記公司代號</button>
          <button id="forgotPasswordBtn" class="linkbtn" type="button">忘記密碼</button>
        </div>

        <div class="hint">沒有資料時，請輸入公司代號、帳號與密碼；員工第一次使用可改用「一次性開通」。</div>
      </div>

      <div id="bindPanel" class="hidden">
        <label for="bindCompany">公司代號</label>
        <input id="bindCompany" placeholder="例如 ang_99" />
        <label for="bindId">員編</label>
        <input id="bindId" placeholder="例如 ANG8963" />
        <label for="bindToken">一次性開通碼 / Token</label>
        <input id="bindToken" placeholder="管理端產生的專屬 token" />
        <button id="bindBtn" class="btn primary" type="button">開通並綁定此手機</button>
        <div class="hint">管理員可在人員管理產生專屬連結。員工開通後，下次可用本機資料自動登入。</div>
      </div>

      <div id="trialPanel" class="hidden">
        <label for="trialName">公司 / 店名</label>
        <input id="trialName" placeholder="例如 99泰式燒烤火鍋" />
        <label for="trialEmail">創辦人 Email</label>
        <input id="trialEmail" type="email" placeholder="you@example.com" />
        <label for="trialOwner">創辦人姓名</label>
        <input id="trialOwner" placeholder="姓名" />
        <button id="trialBtn" class="btn primary" type="button">建立全功能免費體驗區</button>
        <span class="badge">Premium 功能展示｜試用資料可獨立</span>
      </div>

      <div id="status" class="status">準備中...</div>
    </section>
  </main>

<script>
window.addEventListener('error', function(e){
  var el = document.getElementById('status');
  if (el) {
    el.textContent = '前端錯誤：' + (e.message || e.error || '未知錯誤');
    el.className = 'status err';
  }
});
(function(){
  'use strict';

  const CFG = window.ANG_HR_CONFIG || {};
  const qs = new URLSearchParams(location.search);
  const GAS = String(qs.get('gas') || CFG.apiBaseUrl || CFG.gasApiUrl || '').trim();
  const FRONT = String(CFG.frontendBaseUrl || location.origin + location.pathname.replace(/\/[^\/]*$/, '')).replace(/\/+$/, '');
  const EMPLOYEE_PAGE = CFG.employeePage || 'employee.html';
  const ADMIN_PAGE = CFG.adminPage || 'admin.html';
  const GOOGLE_CLIENT_ID = String(CFG.googleClientId || '').trim();

  const $ = id => document.getElementById(id);

  const state = {
    deviceId: getDeviceId(),
    companyCode: qs.get('company_code') || qs.get('company_id') || localStorage.getItem('ang_company_code') || CFG.defaultCompanyCode || '',
    id: qs.get('id') || '',
    token: qs.get('token') || '',
    role: qs.get('role') || '',
    bind: qs.get('bind') === '1'
  };

  $('companyCode').value = state.companyCode || '';
  $('bindCompany').value = state.companyCode || '';
  $('bindId').value = state.id || '';
  $('bindToken').value = state.token || '';

  function getDeviceId(){
    try {
      if (window.ANGHRApp && ANGHRApp.getDeviceId) {
        const v = String(ANGHRApp.getDeviceId() || '').trim();
        if (v) { localStorage.setItem('ang_device_id', v); return v; }
      }
    } catch(e) {}
    let v = qs.get('device_id') || localStorage.getItem('ang_device_id') || '';
    if (!v) {
      v = 'web-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      localStorage.setItem('ang_device_id', v);
    }
    return v;
  }

  function setStatus(msg, type){
    const el = $('status');
    el.textContent = msg || '';
    el.className = 'status' + (type ? ' ' + type : '');
  }

  function setTab(name){
    const panels = { login:$('loginPanel'), bind:$('bindPanel'), trial:$('trialPanel') };
    const tabs = { login:$('tabLogin'), bind:$('tabBind'), trial:$('tabTrial') };
    Object.keys(panels).forEach(k => {
      panels[k].classList.toggle('hidden', k !== name);
      tabs[k].classList.toggle('active', k === name);
    });
  }

  async function api(action, payload){
    if (!GAS) throw new Error('缺少 GAS API URL');
    const res = await fetch(GAS, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({
        action,
        company_code: getCompanyCode(),
        company_id: getCompanyCode(),
        device_id: state.deviceId,
        deviceId: state.deviceId,
        app: 1
      }, payload || {}))
    });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch(e){ throw new Error('GAS 回傳不是 JSON：' + text.slice(0, 200)); }
  }

  function getCompanyCode(){
    return String($('companyCode').value || $('bindCompany').value || state.companyCode || '').trim();
  }

  function saveLogin(data){
    const profile = data.profile || {};
    const id = data.id || data.empId || profile.id || $('loginId').value || $('bindId').value || '';
    const token = data.token || data.login_token || '';
    const role = data.role || profile.role || 'Employee';
    const companyCode = data.company_code || data.companyId || data.company_id || getCompanyCode();

    if (id) localStorage.setItem('ang_login_id', String(id).toUpperCase());
    if (token) localStorage.setItem('ang_login_token', token);
    if (role) localStorage.setItem('ang_login_role', role);
    if (companyCode) localStorage.setItem('ang_company_code', companyCode);
    localStorage.setItem('ang_device_id', state.deviceId);
  }

  function targetPage(role){
    const id = String(localStorage.getItem('ang_login_id') || '').toUpperCase();
    if (id === 'ANG8963' || id === '8963') return 'platform_admin.html';
    const r = String(role || '').toLowerCase();
    if (r === 'platformadmin' || r === 'platform_admin' || r === 'superadmin' || r === 'super_admin') return 'platform_admin.html';
    if (r === 'creator' || r === 'admin' || r === 'manager') return ADMIN_PAGE;
    return EMPLOYEE_PAGE;
  }

  function go(data){
    const profile = data.profile || {};
    const id = data.id || data.empId || profile.id || localStorage.getItem('ang_login_id') || '';
    const token = data.token || localStorage.getItem('ang_login_token') || '';
    const role = data.role || profile.role || localStorage.getItem('ang_login_role') || 'Employee';
    const companyCode = data.company_code || data.companyId || data.company_id || getCompanyCode();

    const url = FRONT + '/' + targetPage(role)
      + '?id=' + encodeURIComponent(id)
      + '&token=' + encodeURIComponent(token)
      + '&role=' + encodeURIComponent(role)
      + '&company_id=' + encodeURIComponent(companyCode)
      + '&company_code=' + encodeURIComponent(companyCode)
      + '&device_id=' + encodeURIComponent(state.deviceId)
      + '&app=1'
      + '&_ts=' + Date.now();
    location.replace(url);
  }

  async function passwordLogin(){
    const companyCode = getCompanyCode();
    const id = $('loginId').value.trim();
    const password = $('loginPw').value;
    if (!companyCode) return setStatus('請輸入公司代號', 'err');
    if (!id) return setStatus('請輸入帳號 / 員編 / Email', 'err');
    if (!password) return setStatus('請輸入密碼', 'err');

    setStatus('登入中...');
    const data = await api('appPasswordLogin', { company_code: companyCode, id, email: id, password });
    if (!data.ok) throw new Error(data.message || '登入失敗');
    saveLogin(data);
    setStatus(data.message || '登入成功', 'ok');
    setTimeout(()=>go(data), 500);
  }

  async function bindLogin(){
    const companyCode = $('bindCompany').value.trim();
    const id = $('bindId').value.trim().toUpperCase();
    const token = $('bindToken').value.trim();
    if (!companyCode) return setStatus('請輸入公司代號', 'err');
    if (!id) return setStatus('請輸入員編', 'err');
    if (!token) return setStatus('請輸入一次性開通碼', 'err');

    setStatus('開通綁定中...');
    const data = await api('appBindLogin', { company_code: companyCode, id, token });
    if (!data.ok) throw new Error(data.message || '開通失敗');
    saveLogin(data);
    setStatus(data.message || '開通成功', 'ok');
    setTimeout(()=>go(data), 500);
  }

  async function autoLogin(){
    const id = localStorage.getItem('ang_login_id') || '';
    const token = localStorage.getItem('ang_login_token') || '';
    const companyCode = localStorage.getItem('ang_company_code') || getCompanyCode();
    if (!id) return setStatus('尚未有本機登入資料，請先登入或一次性開通', 'err');

    setStatus('自動登入中...');
    const data = token
      ? await api('appAutoLogin', { company_code: companyCode, id, token })
      : await api('appDeviceAutoLogin', { company_code: companyCode, id });
    if (!data.ok) throw new Error(data.message || '自動登入失敗');
    saveLogin(data);
    setStatus(data.message || '自動登入成功', 'ok');
    setTimeout(()=>go(data), 450);
  }

  async function forgotCompany(){
    const email = prompt('請輸入 Email，用來查詢公司代號：');
    if (!email) return;
    setStatus('查詢公司代號中...');
    const data = await api('forgotCompanyCode', { email });
    if (!data.ok) throw new Error(data.message || '查詢失敗');
    setStatus(data.message || ('可用公司代號：\\n' + (data.company_codes || []).join('\\n')), 'ok');
  }

  async function forgotPassword(){
    const companyCode = getCompanyCode();
    const email = prompt('請輸入帳號 Email 或員編：');
    if (!email) return;
    setStatus('送出忘記密碼申請中...');
    const data = await api('forgotPassword', { company_code: companyCode, email, id: email });
    if (!data.ok) throw new Error(data.message || '送出失敗');
    setStatus(data.message || '已送出忘記密碼申請，請聯絡管理員或查看 Email。', 'ok');
  }

  async function startTrial(){
    const companyName = $('trialName').value.trim();
    const email = $('trialEmail').value.trim();
    const owner = $('trialOwner').value.trim();
    if (!companyName) return setStatus('請輸入公司 / 店名', 'err');
    if (!email) return setStatus('請輸入創辦人 Email', 'err');
    setStatus('建立免費體驗區中...');
    const data = await api('startFreeTrial', { company_name: companyName, owner_email: email, owner_name: owner });
    if (!data.ok) throw new Error(data.message || '建立失敗');
    saveLogin(data);
    setStatus((data.message || '免費體驗區已建立') + '\\n公司代號：' + (data.company_code || ''), 'ok');
  }

  async function handleGoogleCredential(response){
    try {
      const idToken = response && response.credential;
      if (!idToken) throw new Error('Google 未回傳 id_token');
      const companyCode = getCompanyCode();
      setStatus('Google 登入驗證中...');
      const data = await api('googleLogin', { company_code: companyCode, idToken });
      if (!data.ok) throw new Error(data.message || 'Google 登入失敗');
      saveLogin(data);
      setStatus(data.message || 'Google 登入成功', 'ok');
      setTimeout(()=>go(data), 500);
    } catch(err) {
      setStatus(err.message || String(err), 'err');
    }
  }

  function initGoogle(){
    if (!GOOGLE_CLIENT_ID) {
      $('googleBtn').innerHTML = '<button class="btn blue" type="button" id="googleClientMissingBtn">使用 Google 登入 / 綁定</button>';
      setTimeout(function(){
        var missingBtn = $('googleClientMissingBtn');
        if (missingBtn) missingBtn.onclick = function(){ alert('尚未設定 Google Client ID'); };
      }, 0);
      return;
    }
    window.handleCredentialResponse = handleGoogleCredential;
    const onload = $('g_id_onload');
    onload.setAttribute('data-client_id', GOOGLE_CLIENT_ID);
    onload.setAttribute('data-callback', 'handleCredentialResponse');
    onload.setAttribute('data-auto_prompt', 'false');
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential, auto_select: false, cancel_on_tap_outside: true });
      google.accounts.id.renderButton($('googleBtn'), { theme:'outline', size:'large', width: 300, text:'signin_with' });
    } else {
      setTimeout(initGoogle, 600);
    }
  }

  $('tabLogin').onclick = ()=>setTab('login');
  $('tabBind').onclick = ()=>setTab('bind');
  $('tabTrial').onclick = ()=>setTab('trial');
  $('loginBtn').onclick = ()=>passwordLogin().catch(err=>setStatus(err.message, 'err'));
  $('bindBtn').onclick = ()=>bindLogin().catch(err=>setStatus(err.message, 'err'));
  $('autoBtn').onclick = ()=>autoLogin().catch(err=>setStatus(err.message, 'err'));
  $('forgotCompanyBtn').onclick = ()=>forgotCompany().catch(err=>setStatus(err.message, 'err'));
  $('forgotPasswordBtn').onclick = ()=>forgotPassword().catch(err=>setStatus(err.message, 'err'));
  $('trialBtn').onclick = ()=>startTrial().catch(err=>setStatus(err.message, 'err'));
  $('loginPw').addEventListener('keydown', e=>{ if(e.key==='Enter') $('loginBtn').click(); });

  if (state.bind && state.id && state.token) {
    setTab('bind');
    setStatus('偵測到員工一次性開通連結，請確認後按「開通並綁定此手機」。');
  } else if (localStorage.getItem('ang_login_id')) {
    setTab('login');
    setStatus('已偵測到本機登入資料。\\n請按「使用本機資料自動登入」，不會自動跳走。');
  } else {
    setTab('login');
    setStatus('請輸入公司代號、帳號與密碼；或使用員工一次性開通 / Google 登入 / 免費體驗。');
  }

  initGoogle();
})();
</script>
</body>
</html>
