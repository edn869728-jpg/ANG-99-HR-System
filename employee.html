<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>員工首頁</title>

  

  <style>
    body{
      margin:0;
      background:#f6f7fb;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#1f2937;
    }

    .page{
      max-width:980px;
      margin:0 auto;
      padding:16px;
      box-sizing:border-box;
    }

    .top-space{
      height:8px;
    }

    .hero{
      background:linear-gradient(135deg,#ffffff 0%,#f3f6ff 100%);
      border-radius:22px;
      padding:22px 18px;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      margin-bottom:16px;
    }

    .hero-title{
      font-size:28px;
      font-weight:900;
      margin:0 0 8px;
      line-height:1.2;
    }

    .hero-sub{
      font-size:14px;
      color:#6b7280;
      line-height:1.6;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .card{
      background:#fff;
      border-radius:20px;
      padding:18px;
      box-shadow:0 8px 24px rgba(0,0,0,.06);
      box-sizing:border-box;
    }

    .card-title{
      font-size:18px;
      font-weight:900;
      margin-bottom:10px;
    }

    .muted{
      color:#6b7280;
      font-size:14px;
      line-height:1.6;
    }

    .big{
      font-size:24px;
      font-weight:900;
      line-height:1.2;
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .btn{
      appearance:none;
      border:none;
      border-radius:14px;
      padding:12px 16px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      background:#111827;
      color:#fff;
    }

    .btn.light{
      background:#eef2ff;
      color:#3730a3;
    }

    .btn.gray{
      background:#f3f4f6;
      color:#111827;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .list-item{
      padding:12px 14px;
      border-radius:14px;
      background:#f8fafc;
      border:1px solid #eef2f7;
      font-size:14px;
      line-height:1.5;
    }

    .empty{
      padding:18px;
      border-radius:16px;
      background:#fafafa;
      border:1px dashed #d1d5db;
      color:#6b7280;
      font-size:14px;
      text-align:center;
    }

    .footer-space{
      height:24px;
    }

    .loading{
      text-align:center;
      color:#6b7280;
      padding:30px 16px;
      font-size:14px;
    }

    @media (max-width: 768px){
      .page{
        padding:12px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .hero-title{
        font-size:24px;
      }

      .big{
        font-size:22px;
      }
    }
  </style>
</head>
<body>
  <div id="navContainer">

  </div>

  <div class="page">
    <div class="top-space"></div>

    <div id="loadingBox" class="loading">載入中...</div>

    <div id="mainSection" style="display:none;">
      <section class="hero">
        <div class="hero-title" id="mainTitle">員工首頁</div>
        <div class="hero-sub">
          歡迎回來，<span id="welcomeName">員工</span>
          <span id="globalUserName" style="display:none;"></span>
        </div>
      </section>

      <section class="grid">
        <div class="card">
          <div class="card-title">今日狀態</div>
          <div class="big" id="todayStatusText">尚未載入</div>
          <div class="muted" id="todayStatusSub">正在讀取今日打卡資訊</div>
          <div class="row">
            <button class="btn" onclick="goClock()">前往打卡</button>
            <button class="btn light" onclick="reloadDashboard()">重新整理</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">個人資訊</div>
          <div class="muted">員工編號</div>
          <div class="big" id="employeeIdText">-</div>
          <div class="row">
            <button class="btn gray" onclick="goSalary()">查看薪資</button>
            <button class="btn gray" onclick="logout()">登出</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">本月打卡紀錄</div>
          <div id="monthClockBox" class="list">
            <div class="empty">尚無資料</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">快捷功能</div>
          <div class="list">
            <div class="list-item" onclick="goClock()" style="cursor:pointer;">🕒 打卡中心</div>
            <div class="list-item" onclick="goSalary()" style="cursor:pointer;">💰 薪資查詢</div>
            <div class="list-item" onclick="goUpload()" style="cursor:pointer;">📤 上傳資料</div>
            <div class="list-item" onclick="goIndex()" style="cursor:pointer;">🏠 回首頁</div>
          </div>
        </div>
      </section>

      <div class="footer-space"></div>
    </div>
  </div>

  <script>

    /* ANG HR 月曆日期防呆修正：避免 undefined/null/空白日期造成 getDay() 中斷 */
    function normalizeScheduleDate(value) {
      if (!value && value !== 0) return null;

      if (value instanceof Date) {
        return isNaN(value.getTime()) ? null : value;
      }

      if (typeof value === 'number') {
        const dFromNumber = new Date(value);
        return isNaN(dFromNumber.getTime()) ? null : dFromNumber;
      }

      let s = String(value).trim();
      if (!s) return null;

      s = s
        .replace(/[年月]/g, '/')
        .replace(/[日]/g, '')
        .replace(/-/g, '/')
        .replace(/\s+/g, ' ');

      if (/^\d{8}$/.test(s)) {
        s = s.slice(0, 4) + '/' + s.slice(4, 6) + '/' + s.slice(6, 8);
      }

      const parts = s.split(/[\/ ]/).filter(Boolean);
      if (parts.length >= 3) {
        const y = Number(parts[0]);
        const m = Number(parts[1]);
        const d = Number(parts[2]);

        if (y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31) {
          const fixed = new Date(y, m - 1, d);
          return isNaN(fixed.getTime()) ? null : fixed;
        }
      }

      const parsed = new Date(s);
      return isNaN(parsed.getTime()) ? null : parsed;
    }

    function getScheduleDateFromItem(item) {
      if (!item && item !== 0) return null;

      if (item instanceof Date || typeof item === 'string' || typeof item === 'number') {
        return normalizeScheduleDate(item);
      }

      return normalizeScheduleDate(
        item.date ||
        item.Date ||
        item.day ||
        item.Day ||
        item.scheduleDate ||
        item.workDate ||
        item.startDate ||
        item.shiftDate ||
        item['日期'] ||
        item['排班日期'] ||
        item['上班日期'] ||
        item['工作日期']
      );
    }

    function formatScheduleDate(date) {
      if (!(date instanceof Date) || isNaN(date.getTime())) return '';

      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');

      return y + '/' + m + '/' + d;
    }

    function getScheduleWeekday(date) {
      if (!(date instanceof Date) || isNaN(date.getTime())) return '';

      const weekMap = ['日', '一', '二', '三', '四', '五', '六'];
      return '週' + weekMap[date.getDay()];
    }

    function getSelectedScheduleSummary(list) {
      try {
        const source = Array.isArray(list) ? list : [];

        if (!source.length) {
          return '';
        }

        const validList = source.map(function(item, index) {
          const date = getScheduleDateFromItem(item);

          if (!(date instanceof Date) || isNaN(date.getTime())) {
            console.warn('[ANG HR] 已略過無效排班日期資料：', {
              index: index,
              item: item
            });
            return null;
          }

          if (item && typeof item === 'object' && !(item instanceof Date)) {
            item.__safeDate = date;
            return item;
          }

          return {
            date: date,
            __safeDate: date
          };
        }).filter(function(item) {
          return item !== null;
        });

        if (!validList.length) {
          return '';
        }

        return validList.map(function(item) {
          const date = item.__safeDate;
          const dateText = formatScheduleDate(date);
          const weekText = getScheduleWeekday(date);

          const name =
            item.name ||
            item.employeeName ||
            item.nickname ||
            item.empName ||
            item['姓名'] ||
            item['員工姓名'] ||
            item['暱稱'] ||
            '';

          const shift =
            item.shift ||
            item.shiftName ||
            item.className ||
            item.workShift ||
            item['班別'] ||
            item['班次'] ||
            '';

          let text = dateText;

          if (weekText) text += ' ' + weekText;
          if (name) text += ' ' + name;
          if (shift) text += ' / ' + shift;

          return text;
        }).join('、');

      } catch (err) {
        console.error('[ANG HR] getSelectedScheduleSummary 發生錯誤，但已阻止月曆中斷：', err);
        return '';
      }
    }

    window.addEventListener('error', function(event) {
      const msg = String((event && event.message) || '');
      if (msg.indexOf("Cannot read properties of undefined") !== -1 && msg.indexOf('getDay') !== -1) {
        console.error('[ANG HR] 捕捉到 getDay 日期錯誤，請檢查月曆資料來源是否有空白日期。', event.error || event);
      }
    });

    function getParams(){
      const sp = new URLSearchParams(window.location.search);
      return {
        page: (sp.get('page') || '').trim().toLowerCase(),
        id: (sp.get('id') || '').trim().toUpperCase(),
        name: (sp.get('name') || '').trim()
      };
    }

    function getBaseUrl(){
      return window.location.origin + window.location.pathname;
    }

    function buildUrl(page, id){
      let url = getBaseUrl() + '?page=' + encodeURIComponent(page || 'employee');
      if (id) url += '&id=' + encodeURIComponent(id);
      return url;
    }

    function goPage(page){
      const id = window.currentId || (localStorage.getItem('emp_logged_in') || '').trim().toUpperCase();
      window.location.href = buildUrl(page, id);
    }

    function goLogin(){
      window.location.href = buildUrl('login');
    }

    function goClock(){
      goPage('clock');
    }

    function goSalary(){
      goPage('mysalary');
    }

    function goUpload(){
      goPage('upload');
    }

    function goIndex(){
      goPage('index');
    }

    function logout(){
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('loginId');
      localStorage.removeItem('emp_logged_in');
      localStorage.removeItem('emp_name');
      goLogin();
    }

    function showMainOnly(id, name){
      const loadingBox = document.getElementById('loadingBox');
      const mainSection = document.getElementById('mainSection');
      const mainTitle = document.getElementById('mainTitle');
      const welcomeName = document.getElementById('welcomeName');
      const globalUserName = document.getElementById('globalUserName');
      const employeeIdText = document.getElementById('employeeIdText');

      if (loadingBox) loadingBox.style.display = 'none';
      if (mainSection) mainSection.style.display = 'block';

      if (mainTitle) mainTitle.innerText = '員工首頁';

      const displayName = name || id || '員工';
      if (welcomeName) welcomeName.innerText = displayName;
      if (globalUserName) globalUserName.innerText = displayName;
      if (employeeIdText) employeeIdText.innerText = id || '-';
    }

    function setTodayStatus(text, sub){
      const todayStatusText = document.getElementById('todayStatusText');
      const todayStatusSub = document.getElementById('todayStatusSub');
      if (todayStatusText) todayStatusText.innerText = text || '尚無狀態';
      if (todayStatusSub) todayStatusSub.innerText = sub || '';
    }

    function renderMonthClock(list){
      const box = document.getElementById('monthClockBox');
      if (!box) return;

      if (!Array.isArray(list) || !list.length) {
        box.innerHTML = '<div class="empty">尚無本月打卡紀錄</div>';
        return;
      }

      box.innerHTML = list.map(function(item){
        const d = item.date || item.日期 || '-';
        const inTime = item.in || item.clockIn || item.上班 || '-';
        const outTime = item.out || item.clockOut || item.下班 || '-';
        const hours = item.hours || item.工時 || '-';

        return `
          <div class="list-item">
            <div><strong>${escapeHtml(d)}</strong></div>
            <div>上班：${escapeHtml(String(inTime))}</div>
            <div>下班：${escapeHtml(String(outTime))}</div>
            <div>工時：${escapeHtml(String(hours))}</div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str){
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function loadTodayStatus(id){
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        setTodayStatus('無法載入', 'google.script.run 不存在');
        return;
      }

      google.script.run
        .withSuccessHandler(function(res){
          if (!res || !res.ok) {
            setTodayStatus('讀取失敗', (res && (res.msg || res.message)) || '無法取得今日狀態');
            return;
          }

          const text =
            res.text ||
            res.statusText ||
            res.status ||
            '今日狀態已載入';

          const sub =
            res.subText ||
            res.message ||
            '已完成今日資料讀取';

          setTodayStatus(text, sub);
        })
        .withFailureHandler(function(err){
          setTodayStatus('讀取失敗', err && err.message ? err.message : String(err || 'error'));
        })
        .get_today_status(id);
    }

    function loadMonthClock(id){
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        renderMonthClock([]);
        return;
      }

      google.script.run
        .withSuccessHandler(function(res){
          if (!res || !res.ok) {
            renderMonthClock([]);
            return;
          }

          const list = res.list || res.data || res.records || [];
          renderMonthClock(list);
        })
        .withFailureHandler(function(){
          renderMonthClock([]);
        })
        .get_month_clock(id);
    }

    function reloadDashboard(){
      const id = window.currentId || (localStorage.getItem('emp_logged_in') || '').trim().toUpperCase();
      if (!id) {
        goLogin();
        return;
      }
      loadTodayStatus(id);
      loadMonthClock(id);
    }

    function bootstrapEmployeePage(){
      const p = getParams();
      const idFromUrl = p.id;
      const savedId = (localStorage.getItem('emp_logged_in') || '').trim().toUpperCase();
      const savedName = (localStorage.getItem('emp_name') || '').trim();

      if (!savedId) {
        goLogin();
        return;
      }

      if (!idFromUrl) {
        window.location.replace(buildUrl('employee', savedId));
        return;
      }

      if (idFromUrl !== savedId) {
        logout();
        return;
      }

      window.currentId = savedId;
      window.currentName = savedName || p.name || savedId;

      showMainOnly(savedId, window.currentName);
      loadTodayStatus(savedId);
      loadMonthClock(savedId);
    }

    window.addEventListener('load', bootstrapEmployeePage);
  </script>
</body>
</html>
